<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lift Simulation</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>

    <div class="input__container">
        <input type="number" id="floor-input" placeholder="Enter the number of floors (1-15)" min="1" max="15"/>
        <input type="number" id="lift-input" placeholder="Enter the number of lifts (1-4)" min="1" max="4"/>
        <button type="submit" id="submit-btn">Submit</button>
    </div>

    <div class="container" id="container"></div>

</body>
</html>
